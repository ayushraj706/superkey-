        /* --- HIGH TECH DESIGN --- */
        body { background: #050505; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px; }
        
        header { text-align: center; border-bottom: 2px solid #00ffcc; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #00ffcc; letter-spacing: 3px; text-transform: uppercase; font-size: 24px; }
        
        /* CONTROLS */
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn.active { background: #00ffcc; color: black; font-weight: bold; }

        /* PERIODIC TABLE GRID */
        #periodic-table {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 5px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .element {
            background: #1a1a1a; border: 1px solid #444;
            padding: 5px; text-align: center; cursor: pointer;
            border-radius: 4px; transition: transform 0.2s;
            position: relative;
        }
        .element:hover { background: #333; transform: scale(1.1); border-color: #00ffcc; z-index: 10; }
        .element .num { font-size: 10px; color: #888; display: block; text-align: left; }
        .element .sym { font-size: 18px; font-weight: bold; color: #fff; display: block; }
        .element .name { font-size: 8px; color: #aaa; display: block; overflow: hidden; text-overflow: ellipsis; }

        /* Color Coding based on Type */
        .gas { border-bottom: 3px solid #ff4444; }
        .solid { border-bottom: 3px solid #44ff44; }
        .liquid { border-bottom: 3px solid #4444ff; }

        /* MIXING AREA (Fixed at Bottom) */
        #mixing-zone {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.9); border-top: 2px solid #00ffcc;
            padding: 15px; text-align: center; z-index: 100;
        }
        #selected-list { font-size: 18px; color: yellow; margin-bottom: 10px; min-height: 25px; }
        .action-btn { background: #00ffcc; border: none; padding: 10px 30px; font-weight: bold; font-size: 16px; border-radius: 20px; cursor: pointer; }

        /* INFO POPUP */
        #info-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #222; border: 2px solid #00ffcc;
            padding: 20px; width: 80%; max-width: 400px;
            box-shadow: 0 0 20px rgba(0,255,204,0.2); z-index: 200;
            border-radius: 10px;
        }
    </style>

        // --- RENDER TABLE ---
        function renderTable(sortType) {
            const table = document.getElementById('periodic-table');
            table.innerHTML = '';
            
            // Sorting logic for Mendeleev Mode
            let data = [...elementsDB];
            if(sortType === 'mendeleev') {
                data.sort((a, b) => parseFloat(a.m) - parseFloat(b.m)); // Sort by Mass
            } else {
                data.sort((a, b) => a.n - b.n); // Sort by Number (Modern)
            }

            data.forEach(el => {
                const div = document.createElement('div');
                div.className = `element ${el.type}`;
                div.innerHTML = `<span class="num">${el.n}</span><span class="sym">${el.s}</span><span class="name">${el.name}</span>`;
                div.onclick = () => showInfo(el);
                table.appendChild(div);
            });
        }

            document.getElementById('modal-mass').innerText = el.m + " u";
            document.getElementById('modal-abun').innerText = el.a;
            document.getElementById('modal-desc').innerText = el.d;
            document.getElementById('info-modal').style.display = 'block';
        }

                    closeModal();

            document.getElementById('selected-list').innerText = currentMix.join(" + ");
            document.getElementById('reaction-result').innerText = "";
        }

        function clearMix() {
            currentMix = [];
            updateMixUI();
        }

        function setMode(mode) {
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));

            };

            if (reactions[mix]) {
                res.innerHTML = reactions[mix];
                res.style.color = "#00ffcc";
            } else if (currentMix.length < 2) {
                res.innerHTML = "Needs at least 2 elements.";
                res.style.color = "gray";
            } else {
                res.innerHTML = "🧪 Unknown Mixture or No Reaction defined.";
                res.style.color = "yellow";
            }
        }

        // Start
        renderTable('modern');
    </script>
