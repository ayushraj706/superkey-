<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseKey - Zen</title>
    <style>
        body { background: #2c3e50; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; overflow: hidden; }
        .circle {
            background: #8e44ad; width: 150px; height: 150px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 50px rgba(142, 68, 173, 0.5);
            animation: breathe 8s infinite ease-in-out;
            margin-bottom: 30px;
        }
        @keyframes breathe {
            0% { transform: scale(1); }
            40% { transform: scale(1.8); } /* Inhale */
            60% { transform: scale(1.8); } /* Hold */
            100% { transform: scale(1); } /* Exhale */
        }
        .text { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .goog-te-banner-frame { display: none !important; } body { top: 0 !important; }
    </style>
</head>
<body>
    <div id="google_translate_element" style="display:none;"></div>
    <a href="index.html" style="position:absolute; top:20px; color:white; text-decoration:none; border:1px solid white; padding:5px 15px; border-radius:20px;">Exit</a>

    <div class="circle"></div>
    <div class="text" id="instruct">Breathe In...</div>

    <script>
        const text = document.getElementById('instruct');
        function cycle() {
            text.innerText = "Breathe In...";
            setTimeout(() => { text.innerText = "Hold..."; }, 3000);
            setTimeout(() => { text.innerText = "Breathe Out..."; }, 4500);
        }
        cycle();
        setInterval(cycle, 8000);
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element'); }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
