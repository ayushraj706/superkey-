<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseKey - Meme Verse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- DARK HUMOR THEME --- */
        :root {
            --bg-color: #000;
            --card-bg: #121212;
            --text-main: #fff;
            --accent: #ff4500; /* Reddit Orange */
            --border: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .logo { font-weight: 900; font-size: 20px; background: linear-gradient(to right, #ff4500, #ff8700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; }

        /* FEED CONTAINER */
        .feed {
            margin-top: 70px; /* Space for header */
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 50px;
        }

        /* MEME CARD */
        .card {
            background: var(--card-bg);
            width: 100%; max-width: 500px;
            margin-bottom: 20px;
            border-radius: 0; /* Insta style squares on mobile */
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        @media (min-width: 501px) {
            .card { border-radius: 15px; border: 1px solid var(--border); }
        }

        .card-header {
            padding: 10px 15px;
            display: flex; align-items: center; font-size: 14px; font-weight: bold; color: #ccc;
        }
        .subreddit { color: var(--accent); margin-left: 5px; }

        .meme-img {
            width: 100%; height: auto; display: block; min-height: 200px;
            background: #222; /* Placeholder color */
        }

        .card-actions {
            padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .action-left { display: flex; gap: 20px; font-size: 24px; }
        .icon-btn { cursor: pointer; transition: transform 0.2s; }
        .icon-btn:active { transform: scale(1.2); }
        .like-active { color: red; }

        .card-title {
            padding: 0 15px 15px 15px;
            font-size: 14px; line-height: 1.4;
        }

        /* LOADING SPINNER */
        .loader {
            border: 4px solid #222; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* HEART ANIMATION (Double Tap) */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px; color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            transition: transform 0.2s;
        }
        .heart-pop { transform: translate(-50%, -50%) scale(1.2); }

        /* GOOGLE HACK */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">😂 Meme-Verse</div>
        <a href="index.html" class="back-btn"><i class="fas fa-times"></i></a>
    </header>

    <div id="google_translate_element" style="display:none;"></div>

    <div class="feed" id="feed">
        </div>

    <div class="loader" id="loader"></div>

    <script>
        const feed = document.getElementById('feed');
        const loader = document.getElementById('loader');
        let isLoading = false;

        // --- 1. FETCH MEMES (REDDIT API) ---
        // Hum multiple subreddits se data layenge taaki mix content mile
        const sources = ['memes', 'dankmemes', 'wholesomememes', 'me_irl', 'IndianDankMemes'];

        async function fetchMemes() {
            if (isLoading) return;
            isLoading = true;
            
            // Random source select karo
            const subreddit = sources[Math.floor(Math.random() * sources.length)];
            const url = `https://meme-api.com/gimme/${subreddit}/5`; // Get 5 at a time

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderMemes(data.memes);
                isLoading = false;
            } catch (err) {
                console.error("API Error", err);
                isLoading = false;
                // Retry if failed
                setTimeout(fetchMemes, 2000);
            }
        }

        // --- 2. RENDER CARD ---
        function renderMemes(memes) {
            memes.forEach(meme => {
                // Filter NSFW content (Ganda content na aaye)
                if (meme.nsfw) return;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>Posted in</span>
                        <span class="subreddit">r/${meme.subreddit}</span>
                    </div>
                    
                    <div style="position:relative" ondblclick="animateLike(this)">
                        <i class="fas fa-heart heart-overlay"></i>
                        <img src="${meme.url}" class="meme-img" loading="lazy" alt="Meme">
                    </div>

                    <div class="card-actions">
                        <div class="action-left">
                            <i class="far fa-heart icon-btn" onclick="toggleLike(this)"></i>
                            <i class="far fa-comment icon-btn"></i>
                            <i class="far fa-paper-plane icon-btn"></i>
                        </div>
                        <a href="${meme.url}" download target="_blank" style="color:white;"><i class="fas fa-download icon-btn"></i></a>
                    </div>

                    <div class="card-title">
                        <b>${meme.author}</b> ${meme.title}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // --- 3. INTERACTIONS ---
        function toggleLike(btn) {
            if (btn.classList.contains('fas')) {
                btn.classList.replace('fas', 'far');
                btn.classList.remove('like-active');
            } else {
                btn.classList.replace('far', 'fas');
                btn.classList.add('like-active');
            }
        }

        function animateLike(container) {
            // Heart Popup Logic
            const heart = container.querySelector('.heart-overlay');
            const btn = container.parentElement.querySelector('.fa-heart');
            
            // Pop Animation
            heart.classList.add('heart-pop');
            setTimeout(() => heart.classList.remove('heart-pop'), 600);

            // Turn button red
            btn.classList.replace('far', 'fas');
            btn.classList.add('like-active');
        }

        // --- 4. INFINITE SCROLL ---
        window.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            // Agar user niche pahunchne wala hai (threshold 100px)
            if (scrollTop + clientHeight >= scrollHeight - 500) {
                fetchMemes();
            }
        });

        // Initial Load
        fetchMemes();
        // Load one more batch to fill screen
        setTimeout(fetchMemes, 1000);

        // --- TRANSLATE INIT ---
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,bn,te,mr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
