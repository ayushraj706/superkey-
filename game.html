<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BaseKey - Tic Tac Toe</title>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #222; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; font-weight: bold; }
        .cell.x { color: #ff0055; }
        .cell.o { color: #00ffcc; }
        .status { margin-top: 20px; font-size: 20px; color: gray; }
        button { margin-top: 20px; padding: 10px 20px; background: #00ffcc; border: none; font-weight: bold; cursor: pointer; }
        .goog-te-banner-frame { display: none !important; } body { top: 0 !important; }
    </style>
</head>
<body>
    <div id="google_translate_element" style="display:none;"></div>
    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div class="status" id="status">Player X's Turn</div>
    <button onclick="resetGame()">Restart</button>
    <a href="index.html" style="margin-top:20px; color:white; text-decoration:none;">Exit Game</a>

    <script>
        const board = document.getElementById('board');
        let cells = Array(9).fill(null);
        let turn = 'X';

        function init() {
            board.innerHTML = '';
            cells.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `cell ${c ? c.toLowerCase() : ''}`;
                div.innerText = c || '';
                div.onclick = () => move(i);
                board.appendChild(div);
            });
        }

        function move(i) {
            if (!cells[i]) {
                cells[i] = turn;
                turn = turn === 'X' ? 'O' : 'X';
                document.getElementById('status').innerText = `Player ${turn}'s Turn`;
                init();
            }
        }
        function resetGame() { cells.fill(null); turn = 'X'; init(); }
        init();
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element'); }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
