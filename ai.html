<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseKey - Nexus AI</title>
    <style>
        /* --- CHAT INTERFACE THEME --- */
        :root {
            --bg-color: #343541; /* ChatGPT Dark BG */
            --chat-bg: #444654;
            --user-msg: #10a37f; /* OpenAI Green */
            --bot-msg: #444654;
            --text: #ececf1;
            --input-bg: #40414f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh;
        }

        /* HEADER */
        header {
            background: #202123;
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid #555;
            display: flex; justify-content: space-between; align-items: center;
        }
        .bot-name { font-weight: bold; font-size: 18px; }
        .status { font-size: 10px; color: #00ffcc; }
        .back-btn { text-decoration: none; color: white; border: 1px solid gray; padding: 5px 10px; border-radius: 5px; font-size: 12px; }

        /* CHAT AREA */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 15px;
            position: relative;
        }

        .user {
            background: var(--user-msg);
            align-self: flex-end; /* Right side */
            border-bottom-right-radius: 2px;
        }

        .bot {
            background: var(--bot-msg);
            align-self: flex-start; /* Left side */
            border-bottom-left-radius: 2px;
            border: 1px solid #555;
        }

        .typing {
            font-style: italic; color: gray; font-size: 12px; margin-left: 10px; display: none;
        }

        /* INPUT AREA */
        .input-area {
            background: #202123;
            padding: 15px;
            display: flex; gap: 10px;
            border-top: 1px solid #555;
        }

        input {
            flex: 1;
            background: var(--input-bg);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
        }

        button {
            background: #10a37f;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        /* GOOGLE HACK */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

    <header>
        <div style="text-align:left;">
            <div class="bot-name">🤖 Nexus AI</div>
            <div class="status">● Online</div>
        </div>
        <a href="index.html" class="back-btn">Exit Chat</a>
    </header>

    <div id="google_translate_element" style="display:none;"></div>

    <div id="chat-container">
        <div class="message bot">Hello! I am Nexus, your personal AI assistant. You can ask me about Space, Math, Chemicals, or Ayush (my creator). How can I help?</div>
    </div>

    <div class="typing" id="typing-indicator">Nexus is typing...</div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-container');
        const inputField = document.getElementById('userInput');
        const typingInd = document.getElementById('typing-indicator');

        // --- 1. SEND MESSAGE LOGIC ---
        function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // Add User Message
            addMessage(text, 'user');
            inputField.value = '';

            // Show Typing Effect
            typingInd.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Fake Delay for Realism (1-2 seconds)
            setTimeout(() => {
                const reply = generateResponse(text.toLowerCase());
                typingInd.style.display = 'none';
                addMessage(reply, 'bot');
            }, 1000);
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text; // Allow HTML for links
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll to bottom
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // --- 2. BRAIN OF NEXUS (Logic Engine) ---
        function generateResponse(msg) {
            // SIMPLE KEYWORD MATCHING
            
            if (msg.includes("hello") || msg.includes("hi") || msg.includes("hey")) 
                return "Hello there! Ready to explore science?";
            
            else if (msg.includes("who are you") || msg.includes("name")) 
                return "I am Nexus AI, a neural interface built by BaseKey.";

            else if (msg.includes("creator") || msg.includes("made you") || msg.includes("ayush")) 
                return "I was created by **Ayush Raj** (BaseKey Owner). He is a developer from Bihar.";

            else if (msg.includes("space") || msg.includes("planet") || msg.includes("earth")) 
                return "Space is fascinating! You should check out our <a href='globe.html' style='color:#00ffcc'>Universal Explorer</a> module.";

            else if (msg.includes("math") || msg.includes("calculate") || msg.includes("solve")) 
                return "I am not good at calculation, but my brother is! Use the <a href='math.html' style='color:#00ffcc'>Math Engine</a>.";

            else if (msg.includes("chemical") || msg.includes("reaction") || msg.includes("lab")) 
                return "Mixing chemicals is dangerous here. Go to the <a href='alchemy.html' style='color:#00ffcc'>Alchemy Lab</a> for safety.";

            else if (msg.includes("hack") || msg.includes("cyber") || msg.includes("attack")) 
                return "Security protocols engaged. View the <a href='cyber.html' style='color:#00ffcc'>Live Threat Map</a>.";

            else if (msg.includes("animal") || msg.includes("human") || msg.includes("bio")) 
                return "Biological data found. Access the <a href='bio.html' style='color:#00ffcc'>Bio-Atlas</a>.";

            else if (msg.includes("time")) 
                return "Current System Time: " + new Date().toLocaleTimeString();

            else if (msg.includes("bye")) 
                return "Goodbye! Systems going into standby mode. 😴";

            else 
                return "I am still learning human languages. Try asking about Space, Math, or our Tools.";
        }

        // --- 3. TRANSLATE INIT ---
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi,bn,te,mr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
