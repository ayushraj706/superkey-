<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseKey - Polyglot</title>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; text-align: center; padding: 20px; }
        .card-container { perspective: 1000px; width: 300px; height: 200px; margin: 50px auto; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .card.flipped { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .front { background: white; color: #333; }
        .back { background: #007bff; color: white; transform: rotateY(180deg); }
        .btn { padding: 10px 20px; margin-top: 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .goog-te-banner-frame { display: none !important; } body { top: 0 !important; }
    </style>
</head>
<body>
    <a href="index.html" style="text-decoration:none; color:black;">⬅ Exit</a>
    <h2>Tap card to flip</h2>
    <div id="google_translate_element" style="display:none;"></div>

    <div class="card-container" onclick="this.querySelector('.card').classList.toggle('flipped')">
        <div class="card">
            <div class="front" id="word-front">Hello</div>
            <div class="back" id="word-back">नमस्ते (Namaste)</div>
        </div>
    </div>
    
    <button class="btn" onclick="nextCard()">Next Word ➡</button>

    <script>
        const words = [
            { f: "Hello", b: "नमस्ते (Hindi) / Hola (Spanish)" },
            { f: "Thank You", b: "धन्यवाद (Hindi) / Gracias (Spanish)" },
            { f: "Water", b: "पानी (Hindi) / Agua (Spanish)" },
            { f: "Love", b: "प्रेम (Hindi) / Amor (Spanish)" },
            { f: "Friend", b: "मित्र (Hindi) / Amigo (Spanish)" }
        ];
        function nextCard() {
            const random = words[Math.floor(Math.random() * words.length)];
            document.querySelector('.card').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('word-front').innerText = random.f;
                document.getElementById('word-back').innerText = random.b;
            }, 200);
        }
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element'); }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
