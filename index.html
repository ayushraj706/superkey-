<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        /* आपका पुराना CSS यहाँ रहेगा */
        /* नया Login CSS */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--card); padding: 30px; border-radius: 15px; border: var(--border);
            text-align: center; box-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        input { padding: 12px; border-radius: 8px; border: var(--border); background: #222; color: #fff; width: 80%; margin: 10px 0; }
    </style>
</head>
<body data-theme="dark">

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color:var(--accent)">BaseKey Login</h2>
            <div id="email-step">
                <input type="email" id="user-email" placeholder="Enter your email">
                <button onclick="sendOTP()" class="ad-btn" style="width:100%; height:40px;">Send OTP</button>
            </div>
            <div id="otp-step" style="display:none;">
                <input type="number" id="otp-input" placeholder="Enter 6-digit OTP">
                <button onclick="verifyOTP()" class="ad-btn" style="width:100%; height:40px;">Verify & Enter</button>
            </div>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <header>
            <div class="status-bar">
                <span><i class="fas fa-wifi"></i> <span id="network">4G</span></span>
                <span id="time">00:00</span>
                <span><i class="fas fa-battery-three-quarters"></i> <span id="battery">85%</span></span>
            </div>
            <div class="header-main">
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ayush" alt="User">
                    <div>
                        <h2 style="font-size: 1rem;">Welcome, Chief</h2>
                        <p style="font-size: 0.7rem; opacity: 0.7;">SuperKey Infinity OS</p>
                    </div>
                </div>
                <div class="header-controls">
                    <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer; color:red;"></i>
                </div>
            </div>
        </header>

        <div style="padding: 20px;">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search" placeholder="Search systems..." oninput="filterApps()">
            </div>
            <div class="grid" id="app-grid"></div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCDmDsi_JMQgx_QO4p8bnvfh-vKdN4Bmk8",
            authDomain: "success-points.firebaseapp.com",
            projectId: "success-points",
            storageBucket: "success-points.firebasestorage.app",
            messagingSenderId: "51177935348",
            appId: "1:51177935348:web:33fc4a6810790a3cbd29a1",
            measurementId: "G-64DR1TSTKY"
        };

        let tempOTP = null;

        async function sendOTP() {
            const email = document.getElementById('user-email').value;
            if(!email) return alert("Email to dalo bhai!");
            
            tempOTP = Math.floor(100000 + Math.random() * 900000);
            
            // Calling your Vercel Backend
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp: tempOTP })
            });

            if(res.ok) {
                document.getElementById('email-step').style.display = 'none';
                document.getElementById('otp-step').style.display = 'block';
                alert("OTP bhej diya hai!");
            } else {
                alert("Email nahi gaya. Vercel mein Resend Key check karo.");
            }
        }

        function verifyOTP() {
            const val = document.getElementById('otp-input').value;
            if(val == tempOTP) {
                localStorage.setItem('isLogged', 'true');
                showMain();
            } else {
                alert("Wrong OTP!");
            }
        }

        function logout() {
            localStorage.removeItem('isLogged');
            location.reload();
        }

        function showMain() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            renderApps(apps); // Ye aapke puraane apps array ko render karega
        }

        window.onload = () => {
            if(localStorage.getItem('isLogged')) showMain();
            // Baaki aapka purana clock aur app rendering logic niche
        };

        // --- APPS ARRAY (आपका पुराना वाला यहाँ पेस्ट करें) ---
        const apps = [
            { n: "BaseKey AI", i: "fas fa-robot", t: "ai", u: "https://ayus.fun" },
            // ... baaki apps yahan ...
        ];

        function renderApps(data) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = data.map(app => `
                <div class="card" onclick="haptic(); window.location.href='${app.u}'">
                    <i class="${app.i} icon"></i>
                    <div class="name">${app.n}</div>
                    <div class="tag">${app.t}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
